<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__image-wrapper"></div>

      <div class="product-card__body">
        <h2 class="product-card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>

        <p class="product-card__code">Product code: 195434</p>

        <div
          class="product-card__rating"
          aria-label="Rating: 4 out of 5"
        >
          <div
            class="product-card__stars"
            role="img"
          >
            <div class="product-card__star"></div>
            <div class="product-card__star"></div>
            <div class="product-card__star"></div>
            <div class="product-card__star"></div>
            <div class="product-card__star"></div>
          </div>
          <div class="product-card__reviews">Reviews: 5</div>
        </div>
      </div>

      <div class="product-card__footer">
        <div class="product-card__price">
          <div class="product-card__price-label">Price:</div>
          <div
            class="product-card__price-value"
            itemprop="price"
            content="2199"
          >
            $2,199
          </div>
        </div>

        <button
          class="product-card__button"
          type="button"
          aria-label="Buy product APPLE A1419 iMac"
          data-qa="hover"
        >
          buy
        </button>
      </div>
    </div>
  </body>
</html>
